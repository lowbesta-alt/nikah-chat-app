<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — Nikah</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6">
  <div class="text-center mb-6">
    <div class="text-4xl mb-2">🔐</div>
    <h1 class="text-xl font-bold text-slate-800">Mot de passe oublié</h1>
    <p class="text-sm text-slate-500 mt-1" id="subtitle">Recevez un lien pour le réinitialiser</p>
  </div>

  <div id="step1">
    <form id="emailForm" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-600 mb-1">Votre email</label>
        <input type="email" id="email" required placeholder="vous@exemple.com"
               class="w-full px-3 py-3 border border-slate-300 rounded-lg outline-none focus:border-emerald-500">
      </div>
      <button type="submit" id="sendBtn"
              class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold">
        📩 Envoyer le lien
      </button>
    </form>
    <p id="msg1" class="text-sm text-center mt-3 hidden"></p>
  </div>

  <div id="step2" class="hidden">
    <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-4 text-sm text-emerald-800 mb-4">
      ✅ Un lien vient d'être envoyé à <b id="emailSent"></b>.<br>
      Cliquez dessus pour changer votre mot de passe.
    </div>
    <p class="text-xs text-slate-500 text-center">Pensez à vérifier vos spams.</p>
  </div>

  <div id="step3" class="hidden">
    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-600 mb-1">Nouveau mot de passe</label>
        <div class="relative">
          <input type="password" id="newPwd" required minlength="6" placeholder="Au moins 6 caractères"
                 class="w-full px-3 py-3 pr-12 border border-slate-300 rounded-lg outline-none focus:border-emerald-500">
          <button type="button" onclick="togglePassword('newPwd', this)"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-600 text-xl">
            👁️
          </button>
        </div>
      </div>
      <div>
        <label class="block text-sm text-slate-600 mb-1">Confirmer le mot de passe</label>
        <div class="relative">
          <input type="password" id="newPwd2" required minlength="6" placeholder="Retapez le mot de passe"
                 class="w-full px-3 py-3 pr-12 border border-slate-300 rounded-lg outline-none focus:border-emerald-500">
          <button type="button" onclick="togglePassword('newPwd2', this)"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-600 text-xl">
            👁️
          </button>
        </div>
      </div>
      <button type="submit" id="resetBtn"
              class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold">
        🔑 Changer le mot de passe
      </button>
    </form>
    <p id="msg2" class="text-sm text-center mt-3 hidden"></p>
  </div>

  <div class="text-center mt-6">
    <a href="login.html" class="text-sm text-emerald-600 hover:underline">← Retour à la connexion</a>
  </div>
</div>

<script>
function togglePassword(id, btn) {
  var input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "🙈";
  } else {
    input.type = "password";
    btn.textContent = "👁️";
  }
}

function showStep3() {
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.add("hidden");
  document.getElementById("step3").classList.remove("hidden");
  document.getElementById("subtitle").textContent = "Choisissez votre nouveau mot de passe";
}

function showError(id, text) {
  var el = document.getElementById(id);
  el.textContent = "❌ " + text;
  el.className = "text-sm text-center mt-3 text-red-600";
  el.classList.remove("hidden");
}

var hash = window.location.hash || "";
var search = window.location.search || "";
var isRecoveryLink = hash.indexOf("type=recovery") !== -1 || search.indexOf("type=recovery") !== -1;
var hasLinkError = hash.indexOf("error_code=") !== -1 || hash.indexOf("error_description=") !== -1;

supabaseClient.auth.onAuthStateChange(function (event, session) {
  if (event === "PASSWORD_RECOVERY") {
    showStep3();
  }
  if (event === "SIGNED_IN" && isRecoveryLink && session) {
    showStep3();
  }
});

if (isRecoveryLink && !hasLinkError) {
  showStep3();
}

if (hasLinkError) {
  showError("msg1", "Ce lien est expiré ou invalide. Demandez un nouveau lien ci-dessous.");
}

document.getElementById("emailForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  var email = document.getElementById("email").value.trim();
  var btn = document.getElementById("sendBtn");
  var msg = document.getElementById("msg1");
  btn.disabled = true; btn.textContent = "Envoi…";
  msg.classList.add("hidden");

  var res = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: "https://nikah.sky-global.us/reset-password.html"
  });

  btn.disabled = false; btn.textContent = "📩 Envoyer le lien";

  if (res.error) {
    showError("msg1", res.error.message);
    return;
  }

  document.getElementById("emailSent").textContent = email;
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
});

document.getElementById("resetForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  var p1 = document.getElementById("newPwd").value;
  var p2 = document.getElementById("newPwd2").value;
  var msg = document.getElementById("msg2");

  if (p1 !== p2) {
    showError("msg2", "Les mots de passe ne correspondent pas");
    return;
  }

  var btn = document.getElementById("resetBtn");
  btn.disabled = true; btn.textContent = "Changement…";

  var sessionRes = await supabaseClient.auth.getSession();
  if (!sessionRes.data || !sessionRes.data.session) {
    btn.disabled = false; btn.textContent = "🔑 Changer le mot de passe";
    showError("msg2", "Session introuvable. Le lien est peut-être expiré : redemandez un nouveau lien.");
    return;
  }

  var res = await supabaseClient.auth.updateUser({ password: p1 });

  btn.disabled = false; btn.textContent = "🔑 Changer le mot de passe";

  if (res.error) {
    showError("msg2", res.error.message);
    return;
  }

  msg.textContent = "✅ Mot de passe changé ! Redirection…";
  msg.className = "text-sm text-center mt-3 text-emerald-700";
  msg.classList.remove("hidden");
  setTimeout(function () { window.location.href = "login.html"; }, 2000);
});
</script>
</body>
</html>
