<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — InshaAllah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-emerald-50 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between px-4 py-3">
      <a href="dashboard.html" class="flex items-center gap-2 font-bold text-emerald-700">
        <span class="text-xl">🌙</span><span>InshaAllah</span>
      </a>
      <nav class="flex items-center gap-4 text-sm">
        <a href="search.html" class="text-slate-600 hover:text-emerald-700">Rechercher</a>
        <button onclick="logout()" class="text-red-600 hover:underline">Déconnexion</button>
      </nav>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4">
    <h1 class="text-xl font-bold mb-4">Messages</h1>
    <div id="convList" class="space-y-3"></div>
    <p id="empty" class="text-center text-slate-500 mt-10 hidden">
      Aucune conversation pour l'instant. <br>
      <a href="search.html" class="text-emerald-600 hover:underline">Trouver des profils</a>
    </p>
  </main>

  <script>
    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }

    (async () => {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }

      const { data: convs } = await supabaseClient
        .from('conversations')
        .select('*')
        .or('participant_one.eq.' + user.id + ',participant_two.eq.' + user.id);

      const list = document.getElementById('convList');
      if (!convs || !convs.length) {
        document.getElementById('empty').classList.remove('hidden');
        return;
      }

      // Récupérer les infos de l'autre participant
      const otherIds = convs.map(c => c.participant_one === user.id ? c.participant_two : c.participant_one);
      const { data: users } = await supabaseClient.from('profiles').select('id, username, city, country').in('id', otherIds);

      list.innerHTML = convs.map(c => {
        const otherId = c.participant_one === user.id ? c.participant_two : c.participant_one;
        const other = users?.find(u => u.id === otherId) || { username: 'Utilisateur' };
        return `
          <div class="bg-white rounded-xl shadow p-4">
            <p class="font-semibold">${other.username}</p>
            <p class="text-sm text-slate-500">${c.is_unlocked ? '✅ Illimité' : c.message_count + '/10 messages'}</p>
          </div>
        `;
      }).join('');
    })();
  </script>
</body>
</html>
