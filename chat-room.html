<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversation — InshaAllah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col">

  <header class="bg-white shadow-sm shrink-0">
    <div class="max-w-3xl mx-auto flex items-center gap-3 px-4 py-3">
      <a href="chat.html" class="text-emerald-700 font-bold text-xl">←</a>
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-slate-800 truncate" id="otherName">Chargement…</p>
        <p class="text-xs text-slate-500 truncate" id="otherInfo"></p>
      </div>
      <button onclick="reportUser()" class="text-red-500 text-xl">🚩</button>
      <span id="quota" class="text-xs px-2 py-1 rounded-full bg-amber-50 text-amber-700 whitespace-nowrap"></span>
    </div>
  </header>

  <div id="statusBar" class="text-xs text-center py-2 px-3 shrink-0 bg-slate-200 text-slate-600">Prêt</div>

  <main id="messages" class="flex-1 overflow-y-auto px-4 py-4 space-y-2 max-w-3xl w-full mx-auto"></main>

  <div id="paywall" class="hidden bg-amber-50 border-t border-amber-200 p-4 text-center shrink-0">
    <p class="text-sm text-amber-800 font-medium mb-2">🔓 Vous avez utilisé vos 10 messages gratuits.</p>
    <button onclick="unlockConversation()" class="bg-emerald-600 text-white px-6 py-2 rounded-xl font-semibold">
      💳 Débloquer pour 600 FCFA
    </button>
  </div>

  <footer id="composer" class="bg-white border-t shrink-0">
    <div class="max-w-3xl mx-auto flex items-center gap-2 p-3">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button onclick="document.getElementById('fileInput').click()"
              class="w-11 h-11 rounded-full bg-slate-100 text-lg shrink-0">📷</button>
      <button id="micBtn" class="w-11 h-11 rounded-full bg-slate-100 text-lg shrink-0">🎤</button>
      <input type="text" id="input" placeholder="Écrivez…"
             class="flex-1 px-4 py-3 border border-slate-300 rounded-full outline-none focus:border-emerald-500 min-w-0">
      <button id="sendBtn" onclick="sendMessage()"
              class="bg-emerald-600 text-white w-12 h-12 rounded-full font-bold text-lg shrink-0">➤</button>
    </div>
  </footer>

  <script>
    let currentUser = null;
    let conversationId = null;
    let otherUserId = null;
    let channel = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // 🔑 Set des IDs déjà affichés (pour éviter doublons realtime + local)
    const displayedIds = new Set();

    const params = new URLSearchParams(window.location.search);
    otherUserId = params.get('user');

    function setStatus(text, type) {
      const bar = document.getElementById('statusBar');
      bar.textContent = text;
      bar.className = 'text-xs text-center py-2 px-3 shrink-0 ' + (
        type === 'ok' ? 'bg-emerald-100 text-emerald-800'
        : type === 'err' ? 'bg-red-100 text-red-800'
        : type === 'rec' ? 'bg-red-500 text-white font-bold'
        : 'bg-slate-200 text-slate-600'
      );
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function signedUrl(path) {
      const { data, error } = await supabaseClient.storage
        .from('chat-media').createSignedUrl(path, 3600);
      if (error) { console.error('signedUrl err', error); return null; }
      return data.signedUrl;
    }

    async function renderMessage(m, force = false) {
      // Éviter les doublons
      if (!force && displayedIds.has(m.id)) return;
      displayedIds.add(m.id);

      // Retirer le message "vide" initial
      const emptyMsg = document.getElementById('emptyMsg');
      if (emptyMsg) emptyMsg.remove();

      const mine = m.sender_id === currentUser.id;
      const time = new Date(m.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

      let content = '';
      if (m.content_type === 'text') {
        content = `<p class="whitespace-pre-wrap break-words">${escapeHtml(m.text_body)}</p>`;
      } else if (m.content_type === 'image') {
        const url = m.content_url.startsWith('http') ? m.content_url : await signedUrl(m.content_url);
        content = url ? `<img src="${url}" class="max-w-full rounded-lg">` : `<p class="italic text-xs">[image indisponible]</p>`;
      } else if (m.content_type === 'audio') {
        const url = m.content_url.startsWith('http') ? m.content_url : await signedUrl(m.content_url);
        content = url ? `<audio controls src="${url}" class="max-w-full"></audio>` : `<p class="italic text-xs">[audio indisponible]</p>`;
      }

      const html = `
        <div class="flex ${mine ? 'justify-end' : 'justify-start'}" data-msg-id="${m.id}">
          <div class="max-w-[80%] px-3 py-2 rounded-2xl text-sm ${mine
            ? 'bg-emerald-600 text-white rounded-br-md'
            : 'bg-white text-slate-800 rounded-bl-md shadow-sm'}">
            ${content}
            <p class="text-[10px] mt-1 ${mine ? 'text-emerald-100' : 'text-slate-400'}">${time}</p>
          </div>
        </div>`;
      document.getElementById('messages').insertAdjacentHTML('beforeend', html);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    async function insertMessage(payload) {
      // 🔑 On insère ET on récupère la ligne créée
      const { data, error } = await supabaseClient.from('messages').insert({
        conversation_id: conversationId,
        sender_id: currentUser.id,
        ...payload
      }).select().single();

      if (error) {
        if (error.message.includes('QUOTA_REACHED')) {
          document.getElementById('paywall').classList.remove('hidden');
          document.getElementById('composer').classList.add('hidden');
        } else {
          setStatus('❌ BDD : ' + error.message, 'err');
        }
        return null;
      }

      // ✅ Affichage IMMÉDIAT (sans attendre le realtime)
      await renderMessage(data);
      return data;
    }

    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;

      if (!otherUserId) { setStatus('❌ Utilisateur non précisé', 'err'); return; }

      const { data: other } = await supabaseClient.from('profiles')
        .select('username, city, country').eq('id', otherUserId).single();
      if (other) {
        document.getElementById('otherName').textContent = other.username || 'Utilisateur';
        document.getElementById('otherInfo').textContent = (other.city||'') + (other.country ? ', '+other.country : '');
      }

      const { data: convId, error: rpcErr } = await supabaseClient.rpc('get_or_create_conversation', {
        p_other_user: otherUserId
      });
      if (rpcErr) { setStatus('❌ ' + rpcErr.message, 'err'); return; }
      conversationId = convId;

      const { data: msgs } = await supabaseClient.from('messages')
        .select('*').eq('conversation_id', conversationId)
        .order('created_at', { ascending: true }).limit(200);

      document.getElementById('messages').innerHTML = '';
      if (!msgs || !msgs.length) {
        document.getElementById('messages').innerHTML =
          '<p class="text-center text-slate-400 text-sm py-10" id="emptyMsg">Salam aleykoum 👋<br>Commencez par un message.</p>';
      } else {
        for (const m of msgs) await renderMessage(m);
      }

      await refreshQuota();

      // Realtime pour les messages REÇUS des autres
      channel = supabaseClient.channel('conv:' + conversationId)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages',
          filter: 'conversation_id=eq.' + conversationId }, async (payload) => {
          if (displayedIds.has(payload.new.id)) return; // déjà affiché par nous
          await renderMessage(payload.new);
          refreshQuota();
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'conversations',
          filter: 'id=eq.' + conversationId }, (payload) => updateQuotaUI(payload.new))
        .subscribe();

      setStatus('Prêt', 'info');
    }

    async function refreshQuota() {
      const { data: conv } = await supabaseClient.from('conversations')
        .select('message_count, is_unlocked').eq('id', conversationId).single();
      if (conv) updateQuotaUI(conv);
    }

    function updateQuotaUI(conv) {
      const locked = !conv.is_unlocked && conv.message_count >= 10;
      const q = document.getElementById('quota');
      if (conv.is_unlocked) { q.textContent = 'Illimité ✓'; q.className = 'text-xs px-2 py-1 rounded-full bg-emerald-50 text-emerald-700 whitespace-nowrap';
        document.getElementById('paywall').classList.add('hidden'); document.getElementById('composer').classList.remove('hidden'); }
      else if (locked) { q.textContent = '10/10'; q.className = 'text-xs px-2 py-1 rounded-full bg-red-50 text-red-700 whitespace-nowrap';
        document.getElementById('paywall').classList.remove('hidden'); document.getElementById('composer').classList.add('hidden'); }
      else { const r = 10 - conv.message_count; q.textContent = r + ' msg' + (r>1?'s':''); q.className = 'text-xs px-2 py-1 rounded-full bg-amber-50 text-amber-700 whitespace-nowrap';
        document.getElementById('paywall').classList.add('hidden'); document.getElementById('composer').classList.remove('hidden'); }
    }

    async function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      const r = await insertMessage({ content_type: 'text', text_body: text });
      if (r) setStatus('✅ Message envoyé', 'ok');
    }

    // ---- PHOTO ----
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setStatus('⏳ Préparation photo…', 'info');
      try {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = () => { img.src = reader.result; };
        reader.readAsDataURL(file);
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });

        const canvas = document.createElement('canvas');
        const ratio = Math.min(1, 1280 / Math.max(img.width, img.height));
        canvas.width = img.width * ratio;
        canvas.height = img.height * ratio;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.82));

        setStatus('⏳ Upload photo…', 'info');
        const path = conversationId + '/' + currentUser.id + '/' + Date.now() + '.jpg';
        const { error: upErr } = await supabaseClient.storage
          .from('chat-media').upload(path, blob, { contentType: 'image/jpeg' });
        if (upErr) throw upErr;

        const r = await insertMessage({ content_type: 'image', content_url: path });
        if (r) setStatus('✅ Photo envoyée', 'ok');
      } catch (err) {
        setStatus('❌ Photo : ' + err.message, 'err');
      } finally { e.target.value = ''; }
    });

    // ---- VOCAL ----
    document.getElementById('micBtn').addEventListener('click', async () => {
      if (isRecording) {
        setStatus('⏹ Arrêt…', 'info');
        try { mediaRecorder.stop(); } catch(e) { setStatus('❌ ' + e.message, 'err'); }
        return;
      }
      try {
        setStatus('🎤 Autorisation micro…', 'info');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        let mimeType = '';
        for (const opt of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']) {
          if (MediaRecorder.isTypeSupported(opt)) { mimeType = opt; break; }
        }

        mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          isRecording = false;
          document.getElementById('micBtn').textContent = '🎤';
          document.getElementById('micBtn').classList.remove('bg-red-500', 'text-white');

          const totalSize = audioChunks.reduce((a, c) => a + c.size, 0);
          if (totalSize < 500) { setStatus('❌ Enregistrement vide', 'err'); return; }

          try {
            const actualType = mediaRecorder.mimeType || mimeType || 'audio/webm';
            const blob = new Blob(audioChunks, { type: actualType });
            const ext = actualType.includes('mp4') ? 'm4a' : actualType.includes('ogg') ? 'ogg' : 'webm';

            setStatus('⏳ Upload vocal (' + Math.round(blob.size/1024) + ' Ko)…', 'info');
            const path = conversationId + '/' + currentUser.id + '/' + Date.now() + '.' + ext;
            const { error: upErr } = await supabaseClient.storage
              .from('chat-media').upload(path, blob, { contentType: actualType });
            if (upErr) throw upErr;

            const r = await insertMessage({ content_type: 'audio', content_url: path });
            if (r) setStatus('✅ Vocal envoyé (' + Math.round(blob.size/1024) + ' Ko)', 'ok');
          } catch (err) {
            setStatus('❌ Vocal : ' + err.message, 'err');
          }
        };

        mediaRecorder.start();
        isRecording = true;
        document.getElementById('micBtn').textContent = '⏹';
        document.getElementById('micBtn').classList.add('bg-red-500', 'text-white');
        setStatus('🔴 ENREGISTREMENT… Parle puis touche ⏹', 'rec');
      } catch (err) {
        setStatus('❌ Micro : ' + err.message, 'err');
      }
    });

    async function unlockConversation() {
      if (!confirm('Débloquer pour 600 FCFA / 1 $ ?')) return;
      const { data, error } = await supabaseClient.rpc('unlock_conversation', { p_conversation_id: conversationId });
      if (error) { setStatus('❌ ' + error.message, 'err'); return; }
      if (data) { setStatus('✅ Conversation débloquée !', 'ok'); await refreshQuota(); }
    }

    async function reportUser() {
      const reason = prompt('Raison :\n1. Comportement déplacé\n2. Faux profil\n3. Spam\n4. Autre');
      if (!reason) return;
      const details = prompt('Précisez :') || '';
      const { error } = await supabaseClient.from('reports').insert({
        reporter_id: currentUser.id, reported_id: otherUserId, reason, details
      });
      alert(error ? 'Erreur : ' + error.message : '✅ Signalement envoyé.');
    }

    document.getElementById('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    init();
  </script>
</body>
</html>
