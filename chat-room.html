<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Conversation — InshaAllah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    html, body { height: 100%; overscroll-behavior: none; }
    body { height: 100dvh; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }
    .safe-top { padding-top: env(safe-area-inset-top, 0); }
  </style>
</head>
<body class="bg-slate-100 flex flex-col">

  <header class="bg-white shadow-sm shrink-0 safe-top">
    <div class="max-w-3xl mx-auto flex items-center gap-3 px-3 py-2">
      <a href="chat.html" class="bg-emerald-600 text-white font-semibold text-xs px-3 py-1.5 rounded-full whitespace-nowrap active:bg-emerald-700">← Menu</a>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span id="onlineDot" class="w-2.5 h-2.5 rounded-full bg-gray-400 shrink-0"></span>
          <p class="font-semibold text-slate-800 truncate text-sm" id="otherName">Chargement…</p>
        </div>
        <p class="text-xs text-slate-500 truncate" id="otherInfo"></p>
      </div>
      <button onclick="reportUser()" class="text-red-500 text-lg px-1">🚩</button>
      <span id="quota" class="text-[11px] px-2 py-1 rounded-full bg-amber-50 text-amber-700 whitespace-nowrap"></span>
    </div>
  </header>

  <div id="statusBar" class="text-[11px] text-center py-1 px-3 shrink-0 bg-slate-200 text-slate-600">Prêt</div>

  <main id="messages" class="flex-1 overflow-y-auto px-3 py-3 space-y-1.5 max-w-3xl w-full mx-auto min-h-0"></main>

  <div id="paywall" class="hidden bg-amber-50 border-t border-amber-200 p-4 text-center shrink-0">
    <p class="text-sm text-amber-800 font-medium mb-2">🔓 Vous avez utilisé vos 5 messages gratuits.</p>
    <p class="text-xs text-amber-700 mb-3">Pour continuer cette belle discussion en illimité, débloquez pour 600 FCFA / 1 $.</p>
    <button onclick="unlockConversation()" class="bg-emerald-600 text-white px-6 py-2.5 rounded-xl text-sm font-semibold shadow-sm active:scale-[0.99]">
      💳 Débloquer maintenant — 600 FCFA
    </button>
  </div>

  <footer id="composer" class="bg-white border-t shrink-0 safe-bottom">
    <div class="max-w-3xl mx-auto flex items-center gap-2 p-2">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button onclick="document.getElementById('fileInput').click()"
              class="w-10 h-10 rounded-full bg-slate-100 text-base shrink-0">📷</button>
      <button id="micBtn" class="w-10 h-10 rounded-full bg-slate-100 text-base shrink-0">🎤</button>
      <input type="text" id="input" placeholder="Écrivez…"
             class="flex-1 px-3 py-2 border border-slate-300 rounded-full outline-none focus:border-emerald-500 min-w-0 text-sm">
      <button id="sendBtn" onclick="sendMessage()"
              class="bg-emerald-600 text-white w-10 h-10 rounded-full font-bold text-base shrink-0">➤</button>
    </div>
  </footer>

  <div id="msgMenu" class="hidden fixed inset-0 z-50 bg-black/50 flex items-end">
    <div class="w-full bg-white rounded-t-2xl p-4 safe-bottom">
      <p class="text-sm text-slate-600 text-center mb-3 font-medium">Que faire de ce message ?</p>
      <button onclick="deleteForMe()" class="w-full text-left px-4 py-3 rounded-xl bg-slate-100 mb-2 text-sm font-medium active:bg-slate-200">🗑️ Supprimer pour moi</button>
      <button id="deleteAllBtn" onclick="deleteForEveryone()" class="hidden w-full text-left px-4 py-3 rounded-xl bg-red-50 text-red-700 mb-2 text-sm font-medium active:bg-red-100">🗑️ Supprimer pour tout le monde</button>
      <button onclick="closeMenu()" class="w-full text-center px-4 py-3 rounded-xl text-slate-600 text-sm active:bg-slate-100">Annuler</button>
    </div>
  </div>

  <script>
    let currentUser = null;
    let conversationId = null;
    let otherUserId = null;
    let otherUserName = '';
    let otherUserData = null;
    let isSeedProfile = false;
    let channel = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let selectedMsg = null;
    let presenceInterval = null;
    let limitMessageSent = false;

    const MAX_USER_MESSAGES = 5;   // 🎯 5 messages DE L'UTILISATEUR uniquement

    const displayedIds = new Set();
    let deletedForMe = new Set();

    const params = new URLSearchParams(window.location.search);
    otherUserId = params.get('user');

    function setStatus(text, type) {
      const bar = document.getElementById('statusBar');
      bar.textContent = text;
      bar.className = 'text-[11px] text-center py-1 px-3 shrink-0 ' + (
        type === 'ok' ? 'bg-emerald-100 text-emerald-800'
        : type === 'err' ? 'bg-red-100 text-red-800'
        : type === 'rec' ? 'bg-red-500 text-white font-bold'
        : type === 'typing' ? 'bg-blue-100 text-blue-800'
        : 'bg-slate-200 text-slate-600'
      );
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function signedUrl(path) {
      const { data, error } = await supabaseClient.storage.from('chat-media').createSignedUrl(path, 3600);
      if (error) { console.error(error); return null; }
      return data.signedUrl;
    }

    function loadDeletedForMe() {
      try {
        const key = 'deleted_msgs_' + currentUser.id;
        deletedForMe = new Set(JSON.parse(localStorage.getItem(key) || '[]'));
      } catch(e) { deletedForMe = new Set(); }
    }
    function saveDeletedForMe() {
      localStorage.setItem('deleted_msgs_' + currentUser.id, JSON.stringify([...deletedForMe]));
    }

    // 🎯 Compter les messages UTILISATEUR uniquement
    async function countUserMessages() {
      const { count } = await supabaseClient
        .from('messages')
        .select('*', { count: 'exact', head: true })
        .eq('conversation_id', conversationId)
        .eq('sender_id', currentUser.id);
      return count || 0;
    }

    // ============================================================
    // 🟢 PRÉSENCE EN LIGNE
    // ============================================================
    function updatePresenceDot(lastSeenAt) {
      const dot = document.getElementById('onlineDot');
      if (!lastSeenAt) { dot.className = 'w-2.5 h-2.5 rounded-full bg-gray-400 shrink-0'; return; }
      const diffMin = (Date.now() - new Date(lastSeenAt).getTime()) / 60000;
      if (diffMin < 5) {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0 animate-pulse';
      } else {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-gray-400 shrink-0';
      }
    }
    async function refreshOtherPresence() {
      const { data } = await supabaseClient.from('profiles')
        .select('last_seen_at').eq('id', otherUserId).single();
      if (data) updatePresenceDot(data.last_seen_at);
    }
    async function updateMyPresence() {
      if (!currentUser) return;
      await supabaseClient.from('profiles')
        .update({ last_seen_at: new Date().toISOString() })
        .eq('id', currentUser.id);
    }

    // ============================================================
    // 🤖 RÉPONSES AUTOMATIQUES INTELLIGENTES
    // ============================================================
    const MAX_AUTO_REPLIES = 5;

    function getAutoReplyCount() {
      return parseInt(localStorage.getItem('auto_replies_' + conversationId) || '0');
    }
    function incrementAutoReplyCount() {
      localStorage.setItem('auto_replies_' + conversationId, (getAutoReplyCount() + 1).toString());
    }

    function calcAge(birthDate) {
      if (!birthDate) return null;
      const b = new Date(birthDate), t = new Date();
      let age = t.getFullYear() - b.getFullYear();
      const m = t.getMonth() - b.getMonth();
      if (m < 0 || (m === 0 && t.getDate() < b.getDate())) age--;
      return age;
    }

    function generateReply(userText, count, profile) {
      const t = (userText || '').toLowerCase().trim();
      const p = profile || {};

      const asksWhere = /(^|\s)(où|ou)(\s|$|\?)|quelle ville|quel pays|tu vis|tu habites|vous habitez|tu es où|vous êtes où|dans quelle ville|dans quel pays|région/i.test(t);
      const asksAge = /\b(âge|quel age|quelle age|tu as quel|vous avez quel|ton age|votre age|naissance)\b/i.test(t);
      const asksWork = /\b(travail|travaillez|travaille|profession|métier|job|emploi|carrière|que fais-tu|que faites-vous|études|étudie|université|diplôme|bac)\b/i.test(t);
      const asksFamily = /\b(famille|enfant|parent|père|mère|frère|sœur|fratrie)\b/i.test(t);
      const asksKids = /\b(des enfants|tu as des enfants|vous avez des enfants|déjà.*enfants?|combien.*enfants?)\b/i.test(t);
      const asksReligion = /\b(islam|religio|prière|coran|allah|foi|pratique|pieux|pieuse|sunna|halal|haram)\b/i.test(t);
      const asksMarriage = /\b(mariage|marier|épous|nikah|foyer|moitié|conjoint|époux|épouse)\b/i.test(t);
      const asksPhoto = /\b(photo|photos|image|visage|voir (ton|votre) (photo|visage))\b/i.test(t);
      const asksMeeting = /\b(rencontrer|voir.*(réel|vrai)|rdv|rendez-vous|se voir)\b/i.test(t);
      const asksAboutMe = /\b(qui (es|est)-tu|qui (êtes|etes)-vous|présente-toi|parle.*moi|connaître|ton profil)\b/i.test(t);
      const howAreYou = /\b(ça va|comment (vas|allez|tu vas)|comment vas-tu|comment allez-vous|quoi de neuf|comment (se passe|va))\b/i.test(t);
      const thanks = /\b(merci|choukran|barakallah|jazak)\b/i.test(t);
      const isGreeting = /\b(salam|salem|salut|bonjour|bonsoir|coucou|hello|hi)\b/i.test(t);
      const isFarewell = /\b(au revoir|à bientôt|bye|bonne nuit)\b/i.test(t);
      const isCompliment = /\b(belle|beau|jolie|sérieux|bien|intéressant|agréable|magnifique)\b/i.test(t);

      if (asksWhere) {
        if (p.city && p.country) return `Je suis à ${p.city}, en ${p.country} Al hamdoulillah. Et vous, dans quelle ville êtes-vous ?`;
        return "Je suis en Afrique Al hamdoulillah. Et vous, d'où écrivez-vous ?";
      }
      if (asksAge) {
        const age = calcAge(p.birth_date);
        if (age) return `J'ai ${age} ans Al hamdoulillah. Et vous, si ce n'est pas indiscret ?`;
        return "Je suis dans la fleur de l'âge Al hamdoulillah. Et vous ?";
      }
      if (asksWork) {
        if (p.profession) return `Je suis ${p.profession}${p.education_level ? ' (' + p.education_level + ')' : ''} Al hamdoulillah. Et vous ?`;
        return "Je travaille Al hamdoulillah. Et vous, quel est votre parcours professionnel ?";
      }
      if (asksKids || asksFamily) {
        if (p.has_children && p.children_count > 0) return `Oui, j'ai ${p.children_count} enfant${p.children_count > 1 ? 's' : ''} Al hamdoulillah. Et vous ?`;
        return "Non, je n'ai pas encore d'enfants. Fonder un foyer pieux est mon objectif InshaAllah. Et vous ?";
      }
      if (/\b(célibataire|divorcé|veuf|marié|situation|statut)\b/i.test(t)) {
        const labels = { celibataire: 'célibataire', divorce: 'divorcé(e)', veuf: 'veuf(ve)', marie: 'marié(e)' };
        if (p.marital_status && labels[p.marital_status]) return `Je suis ${labels[p.marital_status]} Al hamdoulillah. Et vous ?`;
      }
      if (isGreeting && count === 0) return `Wa aleykoum salam wa rahmatoullahi wa barakatouh 👋\nEnchanté(e) de faire votre connaissance. Comment allez-vous ?`;
      if (isGreeting && count > 0) return "Salam 😊 Ravie de vous lire. Comment se passe votre journée ?";
      if (howAreYou) return "Al hamdoulillah, je vais très bien. Merci de demander 😊 Et vous ?";
      if (thanks) return "Wa iyyak, qu'Allah vous récompense également 🌸";
      if (asksAboutMe) {
        let parts = [];
        if (p.profession) parts.push(p.profession);
        if (p.city) parts.push('basé(e) à ' + p.city);
        const age = calcAge(p.birth_date);
        if (age) parts.push(age + ' ans');
        if (parts.length) return `Je suis ${parts.join(', ')} Al hamdoulillah. ${p.bio || 'Je cherche une personne sincère pour avancer vers le mariage InshaAllah.'}`;
        return "Je suis quelqu'un de simple, pratiquant(e) et sincère dans ma démarche vers le mariage InshaAllah.";
      }
      if (asksMarriage) {
        const replies = [
          "Oui, je cherche sincèrement à me marier InshaAllah, dans le respect de notre religion. Et vous, quelle est votre démarche ?",
          "Le mariage est une belle sunna. Je souhaite fonder un foyer pieux InshaAllah.",
          "Je cherche une personne sérieuse pour avancer dans le halal InshaAllah."
        ];
        return replies[count % replies.length];
      }
      if (asksReligion) {
        if (p.religiosity_level) {
          const labels = { modere: 'modérément pratiquant(e)', pratiquant: 'pratiquant(e)', tres_pratiquant: 'très pratiquant(e)' };
          return `Je suis ${labels[p.religiosity_level]} Al hamdoulillah. La foi est le pilier de ma vie. Et vous ?`;
        }
        return "La foi est le pilier de ma vie Al hamdoulillah.";
      }
      if (asksPhoto) return "Je préfère avancer dans la pudeur InshaAllah. Nous ferons connaissance petit à petit, si cela vous convient.";
      if (asksMeeting) return "InshaAllah après accord des familles. La pudeur et le respect de nos traditions sont essentiels.";
      if (isCompliment) return "BarakAllahou fik, c'est très gentil 😊 Qu'Allah vous récompense.";
      if (isFarewell) return "Qu'Allah vous facilite et vous protège. À bientôt InshaAllah 🌸";

      const defaults = [
        "Merci pour votre message. Comment se passe votre journée ?",
        "Je vous remercie. Pourriez-vous m'en dire un peu plus sur vous ?",
        "D'accord. Et vous, quel est votre parcours ?",
        "Votre parcours m'intéresse. Quelles sont vos attentes dans le mariage InshaAllah ?",
        "Excusez-moi, je dois m'absenter. Nous reprendrons cette discussion plus tard InshaAllah."
      ];
      return defaults[Math.min(count, defaults.length - 1)];
    }

    async function triggerAutoReply(userText) {
      if (!isSeedProfile) return;
      const count = getAutoReplyCount();
      if (count >= MAX_AUTO_REPLIES) return;

      const delay = 2000 + Math.random() * 2000;

      setTimeout(() => {
        setStatus('💬 ' + otherUserName + ' est en train d\'écrire…', 'typing');
      }, 500);

      setTimeout(async () => {
        const reply = generateReply(userText, count, otherUserData);
        try {
          const { data, error } = await supabaseClient.rpc('reply_as_seed', {
            p_conversation_id: conversationId,
            p_reply_text: reply
          });
          if (error) { setStatus('❌ ' + error.message, 'err'); return; }
          if (!data || !data.ok) { setStatus('❌ ' + (data?.error || 'Erreur'), 'err'); return; }

          if (data.msg_id) {
            const { data: newMsg } = await supabaseClient.from('messages').select('*').eq('id', data.msg_id).single();
            if (newMsg) await renderMessage(newMsg);
          }
          incrementAutoReplyCount();
          setStatus('Prêt', 'info');
          await refreshQuota();
          await refreshOtherPresence();
        } catch(e) { setStatus('❌ ' + e.message, 'err'); }
      }, delay);
    }

    // 🎯 DÉCLENCHEMENT DU MESSAGE MIROIR (limite atteinte)
    async function triggerLimitMessage() {
      if (!isSeedProfile || limitMessageSent) return;
      limitMessageSent = true;

      await new Promise(r => setTimeout(r, 1200));
      setStatus('💬 ' + otherUserName + ' est en train d\'écrire…', 'typing');
      await new Promise(r => setTimeout(r, 1800));

      try {
        const { data, error } = await supabaseClient.rpc('send_seed_limit_message', {
          p_conversation_id: conversationId
        });
        if (error) { setStatus('❌ ' + error.message, 'err'); return; }
        if (!data || !data.ok) { setStatus('❌ ' + (data?.error || 'Erreur'), 'err'); return; }

        if (data.msg_id) {
          const { data: newMsg } = await supabaseClient.from('messages').select('*').eq('id', data.msg_id).single();
          if (newMsg) await renderMessage(newMsg);
        }

        setStatus('🔒 Conversation bloquée', 'err');
        document.getElementById('composer').classList.add('hidden');
        document.getElementById('paywall').classList.remove('hidden');
        await refreshQuota();
      } catch(e) { setStatus('❌ ' + e.message, 'err'); }
    }

    async function renderMessage(m, force = false) {
      if (!force && displayedIds.has(m.id)) return;
      if (deletedForMe.has(m.id)) return;
      displayedIds.add(m.id);

      const emptyMsg = document.getElementById('emptyMsg');
      if (emptyMsg) emptyMsg.remove();

      const mine = m.sender_id === currentUser.id;
      const time = new Date(m.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

      let content = '';
      if (m.content_type === 'text') {
        content = `<p class="whitespace-pre-wrap break-words">${escapeHtml(m.text_body)}</p>`;
      } else if (m.content_type === 'image') {
        const url = m.content_url.startsWith('http') ? m.content_url : await signedUrl(m.content_url);
        content = url ? `<img src="${url}" class="max-w-full rounded-lg">` : `<p class="italic text-xs">[image indisponible]</p>`;
      } else if (m.content_type === 'audio') {
        const url = m.content_url.startsWith('http') ? m.content_url : await signedUrl(m.content_url);
        content = url ? `<audio controls src="${url}" class="max-w-full" style="width:220px"></audio>` : `<p class="italic text-xs">[audio indisponible]</p>`;
      }

      const menuBtn = `<button onclick="event.stopPropagation(); openMenu('${m.id}', ${mine});"
                              class="absolute top-1 ${mine ? 'left-1' : 'right-1'} w-6 h-6 rounded-full bg-black/20 text-white text-xs flex items-center justify-center leading-none">⋮</button>`;

      const html = `
        <div class="flex ${mine ? 'justify-end' : 'justify-start'}" data-msg-id="${m.id}">
          <div class="relative max-w-[80%] px-3 py-2 rounded-2xl text-sm ${mine
            ? 'bg-emerald-600 text-white rounded-br-md'
            : 'bg-white text-slate-800 rounded-bl-md shadow-sm'}">
            ${menuBtn}
            <div class="pr-5 pl-1">
              ${content}
              <p class="text-[10px] mt-1 ${mine ? 'text-emerald-100' : 'text-slate-400'}">${time}</p>
            </div>
          </div>
        </div>`;
      document.getElementById('messages').insertAdjacentHTML('beforeend', html);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function openMenu(msgId, mine) {
      selectedMsg = msgId;
      document.getElementById('msgMenu').classList.remove('hidden');
      const btn = document.getElementById('deleteAllBtn');
      if (mine) btn.classList.remove('hidden'); else btn.classList.add('hidden');
    }
    function closeMenu() { document.getElementById('msgMenu').classList.add('hidden'); selectedMsg = null; }
    function deleteForMe() {
      if (!selectedMsg) return;
      deletedForMe.add(selectedMsg); saveDeletedForMe();
      const el = document.querySelector(`[data-msg-id="${selectedMsg}"]`);
      if (el) el.remove();
      closeMenu();
      setStatus('🗑️ Supprimé pour vous', 'ok');
      setTimeout(() => setStatus('Prêt', 'info'), 2000);
    }
    async function deleteForEveryone() {
      if (!selectedMsg) return;
      if (!confirm('Supprimer ce message pour TOUT LE MONDE ?')) return;
      const { error } = await supabaseClient.from('messages').delete().eq('id', selectedMsg);
      if (error) { setStatus('❌ ' + error.message, 'err'); closeMenu(); return; }
      const el = document.querySelector(`[data-msg-id="${selectedMsg}"]`);
      if (el) el.remove();
      closeMenu();
      setStatus('🗑️ Supprimé', 'ok');
      setTimeout(() => setStatus('Prêt', 'info'), 2000);
    }

    async function markAllAsRead() {
      await supabaseClient.from('messages').update({ is_read: true })
        .eq('conversation_id', conversationId).neq('sender_id', currentUser.id).eq('is_read', false);
    }

    async function insertMessage(payload) {
      const { data, error } = await supabaseClient.from('messages').insert({
        conversation_id: conversationId, sender_id: currentUser.id, ...payload
      }).select().single();

      if (error) {
        if (error.message.includes('QUOTA_REACHED')) {
          document.getElementById('paywall').classList.remove('hidden');
          document.getElementById('composer').classList.add('hidden');
        } else setStatus('❌ ' + error.message, 'err');
        return null;
      }
      await renderMessage(data);
      return data;
    }

    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      loadDeletedForMe();

      if (!otherUserId) { setStatus('❌ Utilisateur non précisé', 'err'); return; }

      const { data: other } = await supabaseClient.from('profiles').select('*').eq('id', otherUserId).single();
      if (other) {
        otherUserData = other;
        otherUserName = other.username || 'Utilisateur';
        isSeedProfile = otherUserName.startsWith('seed_');
        document.getElementById('otherName').textContent = otherUserName;
        document.getElementById('otherInfo').textContent = (other.city||'') + (other.country ? ', '+other.country : '');
        updatePresenceDot(other.last_seen_at);
      }

      const { data: convId, error: rpcErr } = await supabaseClient.rpc('get_or_create_conversation', {
        p_other_user: otherUserId
      });
      if (rpcErr) { setStatus('❌ ' + rpcErr.message, 'err'); return; }
      conversationId = convId;

      const { data: msgs } = await supabaseClient.from('messages')
        .select('*').eq('conversation_id', conversationId)
        .order('created_at', { ascending: true }).limit(200);

      document.getElementById('messages').innerHTML = '';
      if (!msgs || !msgs.length) {
        document.getElementById('messages').innerHTML =
          '<p class="text-center text-slate-400 text-sm py-8" id="emptyMsg">Salam aleykoum 👋<br>Commencez par un message.</p>';
      } else {
        for (const m of msgs) await renderMessage(m);
      }

      await markAllAsRead();
      await refreshQuota();
      await updateMyPresence();
      await refreshOtherPresence();

      presenceInterval = setInterval(async () => {
        await updateMyPresence();
        await refreshOtherPresence();
      }, 30000);

      try {
        channel = supabaseClient.channel('conv:' + conversationId)
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages',
            filter: 'conversation_id=eq.' + conversationId }, async (payload) => {
            if (displayedIds.has(payload.new.id)) return;
            await renderMessage(payload.new);
            if (payload.new.sender_id !== currentUser.id) {
              await supabaseClient.from('messages').update({ is_read: true }).eq('id', payload.new.id);
            }
            refreshQuota();
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'conversations',
            filter: 'id=eq.' + conversationId }, (payload) => updateQuotaUI(payload.new))
          .subscribe();
      } catch(e) { console.warn('Realtime indisponible', e); }

      setStatus('Prêt', 'info');
    }

    async function refreshQuota() {
      const userCount = await countUserMessages();
      const { data: conv } = await supabaseClient.from('conversations')
        .select('is_unlocked').eq('id', conversationId).single();

      if (conv) {
        updateQuotaUI({ message_count: userCount, is_unlocked: conv.is_unlocked });
      }
      return { message_count: userCount, is_unlocked: conv?.is_unlocked };
    }

    function updateQuotaUI(conv) {
      const locked = !conv.is_unlocked && conv.message_count >= MAX_USER_MESSAGES;
      const q = document.getElementById('quota');
      if (conv.is_unlocked) {
        q.textContent = 'Illimité ✓';
        q.className = 'text-[11px] px-2 py-1 rounded-full bg-emerald-50 text-emerald-700 whitespace-nowrap';
        document.getElementById('paywall').classList.add('hidden');
        document.getElementById('composer').classList.remove('hidden');
      } else if (locked) {
        q.textContent = '5/5';
        q.className = 'text-[11px] px-2 py-1 rounded-full bg-red-50 text-red-700 whitespace-nowrap';
        document.getElementById('paywall').classList.remove('hidden');
        document.getElementById('composer').classList.add('hidden');
      } else {
        const r = MAX_USER_MESSAGES - conv.message_count;
        q.textContent = r + ' msg' + (r > 1 ? 's' : '');
        q.className = 'text-[11px] px-2 py-1 rounded-full bg-amber-50 text-amber-700 whitespace-nowrap';
        document.getElementById('paywall').classList.add('hidden');
        document.getElementById('composer').classList.remove('hidden');
      }
    }

    async function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      const r = await insertMessage({ content_type: 'text', text_body: text });
      if (!r) return;
      setStatus('✅ Envoyé', 'ok');

      // 🎯 Compter UNIQUEMENT les messages de l'utilisateur
      const userCount = await countUserMessages();

      if (userCount >= MAX_USER_MESSAGES) {
        // 5 messages UTILISATEUR atteints → message miroir + blocage
        await triggerLimitMessage();
      } else {
        // Sinon, réponse normale du seed
        triggerAutoReply(text);
      }
    }

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setStatus('⏳ Photo…', 'info');
      try {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = () => { img.src = reader.result; };
        reader.readAsDataURL(file);
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
        const canvas = document.createElement('canvas');
        const ratio = Math.min(1, 1280 / Math.max(img.width, img.height));
        canvas.width = img.width * ratio;
        canvas.height = img.height * ratio;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.82));
        const path = conversationId + '/' + currentUser.id + '/' + Date.now() + '.jpg';
        const { error: upErr } = await supabaseClient.storage.from('chat-media').upload(path, blob, { contentType: 'image/jpeg' });
        if (upErr) throw upErr;
        const r = await insertMessage({ content_type: 'image', content_url: path });
        if (r) setStatus('✅ Photo envoyée', 'ok');
      } catch (err) { setStatus('❌ ' + err.message, 'err'); }
      finally { e.target.value = ''; }
    });

    document.getElementById('micBtn').addEventListener('click', async () => {
      if (isRecording) { try { mediaRecorder.stop(); } catch(e) {} return; }
      try {
        setStatus('🎤 Micro…', 'info');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        let mimeType = '';
        for (const opt of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']) {
          if (MediaRecorder.isTypeSupported(opt)) { mimeType = opt; break; }
        }
        mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          isRecording = false;
          document.getElementById('micBtn').textContent = '🎤';
          document.getElementById('micBtn').classList.remove('bg-red-500', 'text-white');
          const totalSize = audioChunks.reduce((a, c) => a + c.size, 0);
          if (totalSize < 500) { setStatus('❌ Enregistrement vide', 'err'); return; }
          try {
            const actualType = mediaRecorder.mimeType || mimeType || 'audio/webm';
            const blob = new Blob(audioChunks, { type: actualType });
            const ext = actualType.includes('mp4') ? 'm4a' : actualType.includes('ogg') ? 'ogg' : 'webm';
            setStatus('⏳ Upload vocal…', 'info');
            const path = conversationId + '/' + currentUser.id + '/' + Date.now() + '.' + ext;
            const { error: upErr } = await supabaseClient.storage.from('chat-media').upload(path, blob, { contentType: actualType });
            if (upErr) throw upErr;
            const r = await insertMessage({ content_type: 'audio', content_url: path });
            if (r) setStatus('✅ Vocal envoyé', 'ok');
          } catch (err) { setStatus('❌ ' + err.message, 'err'); }
        };
        mediaRecorder.start();
        isRecording = true;
        document.getElementById('micBtn').textContent = '⏹';
        document.getElementById('micBtn').classList.add('bg-red-500', 'text-white');
        setStatus('🔴 Enregistrement… Touche ⏹', 'rec');
      } catch (err) { setStatus('❌ Micro : ' + err.message, 'err'); }
    });

    function unlockConversation() {
      window.location.href = 'paiement.html?user=' + otherUserId;
    }

    async function reportUser() {
      const reason = prompt('Raison :\n1. Comportement déplacé\n2. Faux profil\n3. Spam\n4. Autre');
      if (!reason) return;
      const details = prompt('Précisez :') || '';
      const { error } = await supabaseClient.from('reports').insert({
        reporter_id: currentUser.id, reported_id: otherUserId, reason, details
      });
      alert(error ? 'Erreur : ' + error.message : '✅ Signalement envoyé.');
    }

    document.getElementById('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    window.addEventListener('beforeunload', () => {
      if (presenceInterval) clearInterval(presenceInterval);
    });

    init();
  </script>
</body>
</html>
