<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un administrateur — InshaAllah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 text-slate-100">

  <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🔐</div>
      <h1 class="text-xl font-bold">Créer un administrateur</h1>
      <p class="text-xs text-slate-400 mt-1">Page réservée au propriétaire du site</p>
    </div>

    <form id="setupForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Code secret</label>
        <input type="password" id="secret" required
               class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl outline-none focus:border-emerald-500 text-white"
               placeholder="Code fourni par le développeur">
        <p class="text-[11px] text-slate-500 mt-1">Ce code empêche n'importe qui de devenir admin.</p>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Nom / Pseudo</label>
        <input type="text" id="username" required minlength="3"
               class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl outline-none focus:border-emerald-500 text-white"
               placeholder="Ex: Meca">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" id="email" required
               class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl outline-none focus:border-emerald-500 text-white"
               placeholder="vous@exemple.com">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Mot de passe</label>
        <div class="relative">
          <input type="password" id="password" required minlength="6"
                 class="w-full px-4 py-3 pr-12 bg-slate-900 border border-slate-600 rounded-xl outline-none focus:border-emerald-500 text-white"
                 placeholder="Minimum 6 caractères">
          <button type="button" onclick="togglePwd()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" id="btnSubmit"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl disabled:opacity-50">
        Créer mon compte administrateur
      </button>
    </form>

    <div id="message" class="hidden mt-4 p-3 rounded-lg text-sm"></div>

    <p class="text-center text-xs text-slate-500 mt-6">
      <a href="index.html" class="hover:underline">← Retour à l'accueil</a>
    </p>
  </div>

  <script>
    // 🔑 CODE SECRET à changer si nécessaire
    const ADMIN_SECRET_CODE = 'ADMIN-NIKAH-2024';

    const msg = document.getElementById('message');

    function show(t, c) {
      msg.textContent = t;
      msg.className = 'mt-4 p-3 rounded-lg text-sm ' + (c === 'ok'
        ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
        : 'bg-red-500/20 text-red-300 border border-red-500/30');
      msg.classList.remove('hidden');
    }

    function togglePwd() {
      const i = document.getElementById('password');
      const b = event.target;
      if (i.type === 'password') { i.type = 'text'; b.textContent = '🙈'; }
      else { i.type = 'password'; b.textContent = '👁️'; }
    }

    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true; btn.textContent = 'Création…';

      const secret = document.getElementById('secret').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (secret !== ADMIN_SECRET_CODE) {
        show('❌ Code secret invalide.', 'err');
        btn.disabled = false; btn.textContent = 'Créer mon compte administrateur';
        return;
      }

      try {
        // 1. Créer le compte
        const { data, error } = await supabaseClient.auth.signUp({
          email, password,
          options: { data: { username, gender: 'male' } }
        });

        if (error) throw error;
        if (!data.user) throw new Error('Utilisateur non créé');

        // 2. Créer / mettre à jour le profil avec is_admin = true
        await supabaseClient.from('profiles').upsert({
          id: data.user.id,
          username: username,
          gender: 'male',
          is_admin: true
        }, { onConflict: 'id' });

        show('✅ Compte administrateur créé ! Redirection…', 'ok');
        setTimeout(() => window.location.href = 'admin.html', 1500);

      } catch (err) {
        console.error(err);
        show('❌ ' + err.message, 'err');
        btn.disabled = false; btn.textContent = 'Créer mon compte administrateur';
      }
    });
  </script>
</body>
</html>
