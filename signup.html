<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — InshaAllah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <div class="text-4xl mb-2">🌙</div>
      <h1 class="text-2xl font-bold text-emerald-700">Créer un compte</h1>
    </div>

    <form id="signupForm" class="space-y-4">
      <input type="text" id="username" placeholder="Pseudo" required minlength="3"
             class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none">
      <input type="email" id="email" placeholder="Email" required
             class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none">
      <input type="password" id="password" placeholder="Mot de passe (6 min)" required minlength="6"
             class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none">
      <select id="gender" required class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none bg-white">
        <option value="">— Genre —</option>
        <option value="male">Homme</option>
        <option value="female">Femme</option>
      </select>
      <button type="submit" id="btnSubmit"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl">
        Créer mon compte
      </button>
    </form>

    <div id="message" class="hidden mt-4 p-3 rounded-lg text-sm"></div>
    <p class="text-center text-sm text-slate-500 mt-6">
      Déjà un compte ? <a href="login.html" class="text-emerald-600 hover:underline">Se connecter</a>
    </p>
  </div>

  <script>
    const msg = document.getElementById('message');
    function show(t, c) {
      msg.textContent = t;
      msg.className = 'mt-4 p-3 rounded-lg text-sm ' + (c === 'ok'
        ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
        : 'bg-red-50 text-red-700 border border-red-200');
      msg.classList.remove('hidden');
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true; btn.textContent = 'Création…';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const gender = document.getElementById('gender').value;

      const { data, error } = await supabaseClient.auth.signUp({
        email, password, options: { data: { username, gender } }
      });

      if (error) {
        show('❌ ' + error.message, 'err');
        btn.disabled = false; btn.textContent = 'Créer mon compte';
        return;
      }

      if (data.user) {
        await supabaseClient.from('profiles').insert({
          id: data.user.id, username, gender
        });
      }

      show('✅ Compte créé ! Redirection…', 'ok');
      setTimeout(() => window.location.href = 'dashboard.html', 1500);
    });
  </script>
</body>
</html>
