<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — InshaAllah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <div class="text-4xl mb-2">🌙</div>
      <h1 class="text-2xl font-bold text-emerald-700">Créer un compte</h1>
      <p class="text-sm text-slate-500 mt-1">Rejoignez la communauté InshaAllah</p>
    </div>

    <form id="signupForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Pseudo</label>
        <input type="text" id="username" required minlength="3"
               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
               placeholder="Ex: Abdoulaye92">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" id="email" required
               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
               placeholder="vous@exemple.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
        <input type="password" id="password" required minlength="6"
               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
               placeholder="Minimum 6 caractères">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Genre</label>
        <select id="gender" required
                class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none bg-white">
          <option value="">— Choisir —</option>
          <option value="male">Homme</option>
          <option value="female">Femme</option>
        </select>
      </div>

      <button type="submit" id="btnSubmit"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition disabled:opacity-50">
        Créer mon compte
      </button>
    </form>

    <div id="message" class="hidden mt-4 p-3 rounded-lg text-sm"></div>

    <p class="text-center text-sm text-slate-500 mt-6">
      Déjà un compte ?
      <a href="login.html" class="text-emerald-600 font-medium hover:underline">Se connecter</a>
    </p>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const btn = document.getElementById('btnSubmit');
    const msg = document.getElementById('message');

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = 'mt-4 p-3 rounded-lg text-sm ' + (
        type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                            : 'bg-red-50 text-red-700 border border-red-200'
      );
      msg.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Création en cours…';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const gender = document.getElementById('gender').value;

      try {
        // 1. Créer le compte utilisateur
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: { username, gender }
          }
        });

        if (error) throw error;

        // 2. Créer son profil dans la table "profiles"
        if (data.user) {
          const { error: profileError } = await supabaseClient
            .from('profiles')
            .insert({
              id: data.user.id,
              username: username,
              gender: gender
            });

          if (profileError) {
            console.warn('Profil non créé (peut-être déjà):', profileError.message);
          }
        }

        showMessage('✅ Compte créé ! Vérifiez votre email pour confirmer votre inscription.', 'success');
        form.reset();
      } catch (err) {
        console.error(err);
        showMessage('❌ ' + (err.message || 'Erreur lors de l\'inscription'), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Créer mon compte';
      }
    });
  </script>
</body>
</html>
