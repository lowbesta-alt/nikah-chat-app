<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recherche — InshaAllah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-emerald-50 min-h-screen">
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2 font-bold text-emerald-700">
        <span class="text-xl">🌙</span><span>InshaAllah</span>
      </div>
      <nav class="flex items-center gap-3 text-sm">
        <a href="dashboard.html" class="text-slate-600 hover:text-emerald-700">👤</a>
        <a href="chat.html" class="text-slate-600 hover:text-emerald-700 relative">
          🔔
          <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center font-bold">0</span>
        </a>
        <button onclick="logout()" class="text-red-600 hover:underline">Déco</button>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4">
    <h1 class="text-xl font-bold mb-4">Rechercher des profils</h1>

    <form id="searchForm" class="bg-white rounded-2xl shadow p-4 mb-6 space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <select id="filter_gender" class="px-3 py-2 border rounded-lg bg-white">
          <option value="">Genre</option>
          <option value="male">Homme</option>
          <option value="female">Femme</option>
        </select>
        <select id="filter_religiosity" class="px-3 py-2 border rounded-lg bg-white">
          <option value="">Pratique</option>
          <option value="modere">Modéré</option>
          <option value="pratiquant">Pratiquant</option>
          <option value="tres_pratiquant">Très pratiquant</option>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <select id="filter_veil" class="px-3 py-2 border rounded-lg bg-white">
          <option value="">Tenue (femmes)</option>
          <option value="hijab">🧕 Hijab</option>
          <option value="niqab">🖤 Niqab</option>
          <option value="none">Sans voile</option>
        </select>
        <select id="filter_marital" class="px-3 py-2 border rounded-lg bg-white">
          <option value="">Situation</option>
          <option value="celibataire">Célibataire</option>
          <option value="divorce">Divorcé(e)</option>
          <option value="veuf">Veuf(ve)</option>
          <option value="marie">Marié(e)</option>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <input type="text" id="filter_country" placeholder="Pays" class="px-3 py-2 border rounded-lg">
        <input type="text" id="filter_city" placeholder="Ville" class="px-3 py-2 border rounded-lg">
      </div>
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1">Âge min</label>
          <input type="number" id="filter_age_min" placeholder="18" min="18" max="99" class="w-full px-3 py-2 border rounded-lg">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Âge max</label>
          <input type="number" id="filter_age_max" placeholder="99" min="18" max="99" class="w-full px-3 py-2 border rounded-lg">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Enfants</label>
          <select id="filter_children" class="w-full px-3 py-2 border rounded-lg bg-white">
            <option value="">—</option>
            <option value="no">Aucun</option>
            <option value="yes">Oui</option>
          </select>
        </div>
      </div>
      <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold">
        🔍 Rechercher
      </button>
    </form>

    <p id="resultsInfo" class="text-sm text-slate-500 mb-3 hidden"></p>
    <div id="results" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
  </main>

  <script>
    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }

    async function loadNotifBadge() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return;
      const { data: convs } = await supabaseClient.from('conversations').select('id')
        .or('participant_one.eq.' + user.id + ',participant_two.eq.' + user.id);
      if (!convs || !convs.length) return;
      const convIds = convs.map(c => c.id);
      const { count } = await supabaseClient.from('messages').select('*', { count: 'exact', head: true })
        .in('conversation_id', convIds).eq('is_read', false).neq('sender_id', user.id);
      const badge = document.getElementById('notifBadge');
      if (count && count > 0) { badge.textContent = count > 99 ? '99+' : count; badge.classList.remove('hidden'); }
      else badge.classList.add('hidden');
    }

    loadNotifBadge();
    setInterval(loadNotifBadge, 15000);

    function calcAge(birthDate) {
      if (!birthDate) return null;
      const b = new Date(birthDate), t = new Date();
      let age = t.getFullYear() - b.getFullYear();
      const m = t.getMonth() - b.getMonth();
      if (m < 0 || (m === 0 && t.getDate() < b.getDate())) age--;
      return age;
    }

    async function search(filters = {}) {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }

      const results = document.getElementById('results');
      const info = document.getElementById('resultsInfo');
      results.innerHTML = '<p class="text-center text-slate-400 py-6 col-span-full">Recherche…</p>';

      let q = supabaseClient.from('profiles').select('*').neq('id', user.id);
      if (filters.gender) q = q.eq('gender', filters.gender);
      if (filters.country) q = q.ilike('country', '%' + filters.country + '%');
      if (filters.city) q = q.ilike('city', '%' + filters.city + '%');
      if (filters.religiosity) q = q.eq('religiosity_level', filters.religiosity);
      if (filters.marital) q = q.eq('marital_status', filters.marital);
      if (filters.veil) q = q.eq('veil_type', filters.veil);
      if (filters.children === 'no') q = q.eq('has_children', false);
      if (filters.children === 'yes') q = q.eq('has_children', true);
      if (filters.ageMin) { const d = new Date(); d.setFullYear(d.getFullYear() - filters.ageMin); q = q.lte('birth_date', d.toISOString().split('T')[0]); }
      if (filters.ageMax) { const d = new Date(); d.setFullYear(d.getFullYear() - filters.ageMax - 1); q = q.gte('birth_date', d.toISOString().split('T')[0]); }

      const { data, error } = await q.order('last_seen_at', { ascending: false, nullsFirst: false }).limit(50);

      if (error) { results.innerHTML = '<p class="text-red-600 col-span-full">Erreur: ' + error.message + '</p>'; return; }
      if (!data.length) { info.classList.add('hidden'); results.innerHTML = '<p class="text-slate-500 text-center py-10 col-span-full">Aucun profil trouvé.</p>'; return; }

      info.textContent = data.length + ' profil(s) trouvé(s)';
      info.classList.remove('hidden');

      results.innerHTML = data.map(p => {
        const age = calcAge(p.birth_date);
        const initials = (p.username || '?').charAt(0).toUpperCase();
        const photo = p.avatar_url
          ? '<img src="' + p.avatar_url + '" class="w-full h-full object-cover">'
          : '<div class="w-full h-full flex items-center justify-center bg-emerald-100 text-emerald-700 font-bold text-4xl">' + initials + '</div>';

        // Point vert uniquement pour les vrais utilisateurs actifs
        const isOnline = (p.last_seen_at && ((Date.now() - new Date(p.last_seen_at).getTime()) / 60000 < 5));

        return `
          <a href="profile-view.html?id=${p.id}" class="block bg-white rounded-2xl shadow overflow-hidden hover:shadow-lg transition">
            <div class="relative aspect-square bg-slate-100">
              ${photo}
              <span class="absolute top-2 right-2 w-3.5 h-3.5 rounded-full ${isOnline ? 'bg-emerald-500' : 'bg-gray-400'} border-2 border-white shadow"></span>
            </div>
            <div class="p-3">
              <p class="font-semibold text-slate-800 text-sm truncate">${p.username || 'Anonyme'}</p>
              <p class="text-xs text-slate-500 truncate">${age ? age + ' ans' : ''}${age && (p.city || p.country) ? ' · ' : ''}${p.city || ''}${p.city && p.country ? ', ' : ''}${p.country || ''}</p>
            </div>
          </a>
        `;
      }).join('');
    }

    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      search({
        gender: document.getElementById('filter_gender').value,
        country: document.getElementById('filter_country').value.trim(),
        city: document.getElementById('filter_city').value.trim(),
        religiosity: document.getElementById('filter_religiosity').value,
        marital: document.getElementById('filter_marital').value,
        veil: document.getElementById('filter_veil').value,
        children: document.getElementById('filter_children').value,
        ageMin: parseInt(document.getElementById('filter_age_min').value) || null,
        ageMax: parseInt(document.getElementById('filter_age_max').value) || null
      });
    });

    search();
  </script>
</body>
</html>
