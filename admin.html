<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — InshaAllah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100">
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2 font-bold">
        <span class="text-xl">⚙️</span><span>Admin</span>
      </div>
      <nav class="flex items-center gap-3 text-sm">
        <a href="dashboard.html" class="text-slate-300 hover:text-white">Site</a>
        <button onclick="logout()" class="text-red-400 hover:underline">Déco</button>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-800 rounded-xl p-3 text-center">
        <p class="text-xs text-slate-400">En attente</p>
        <p class="text-2xl font-bold text-amber-400" id="statPending">—</p>
      </div>
      <div class="bg-slate-800 rounded-xl p-3 text-center">
        <p class="text-xs text-slate-400">Convs bloquées</p>
        <p class="text-2xl font-bold text-red-400" id="statBlocked">—</p>
      </div>
      <div class="bg-slate-800 rounded-xl p-3 text-center">
        <p class="text-xs text-slate-400">Convs débloquées</p>
        <p class="text-2xl font-bold text-emerald-400" id="statUnlocked">—</p>
      </div>
      <div class="bg-slate-800 rounded-xl p-3 text-center">
        <p class="text-xs text-slate-400">💰 Revenus du mois</p>
        <p class="text-2xl font-bold text-emerald-400" id="statRevenue">—</p>
      </div>
    </div>

    <div class="bg-gradient-to-r from-emerald-900/50 to-emerald-800/30 rounded-xl p-4 border border-emerald-700/30">
      <p class="text-xs text-emerald-300 mb-2">💰 REVENUS TOTAUX</p>
      <p class="text-3xl font-bold text-emerald-400" id="statTotal">0 FCFA</p>
      <p class="text-xs text-slate-400 mt-1"><span id="statCount">0</span> paiement(s) validé(s)</p>
    </div>

    <div class="flex gap-2 border-b border-slate-700 overflow-x-auto">
      <button id="tabPending" onclick="showTab('pending')" class="px-4 py-2 text-sm font-medium border-b-2 border-emerald-500 text-emerald-400 whitespace-nowrap">Demandes</button>
      <button id="tabUsers" onclick="showTab('users')" class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-400 whitespace-nowrap">Utilisateurs</button>
      <button id="tabAll" onclick="showTab('all')" class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-400 whitespace-nowrap">Conversations</button>
      <button id="tabReports" onclick="showTab('reports')" class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-400 whitespace-nowrap">Signalements</button>
      <button id="tabSettings" onclick="showTab('settings')" class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-400 whitespace-nowrap">⚙️ Paiement</button>
    </div>

    <section id="secPending" class="space-y-3"></section>
    <section id="secUsers" class="space-y-3 hidden"></section>
    <section id="secAll" class="space-y-3 hidden"></section>
    <section id="secReports" class="space-y-3 hidden"></section>
    <section id="secSettings" class="space-y-3 hidden"></section>

  </main>

  <script>
    let currentUser = null;

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }

    function showTab(name) {
      ['pending','users','all','reports','settings'].forEach(t => {
        const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
        const sec = document.getElementById('sec' + t.charAt(0).toUpperCase() + t.slice(1));
        if (t === name) {
          btn.className = 'px-4 py-2 text-sm font-medium border-b-2 border-emerald-500 text-emerald-400 whitespace-nowrap';
          sec.classList.remove('hidden');
        } else {
          btn.className = 'px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-400 whitespace-nowrap';
          sec.classList.add('hidden');
        }
      });
    }

    function fmtDate(s) { return new Date(s).toLocaleString('fr-FR'); }

    async function loadStats() {
      const { count: pending } = await supabaseClient
        .from('payments').select('*', { count: 'exact', head: true }).eq('status', 'pending');
      const { count: blocked } = await supabaseClient
        .from('conversations').select('*', { count: 'exact', head: true })
        .eq('is_unlocked', false).gte('message_count', 10);
      const { count: unlocked } = await supabaseClient
        .from('conversations').select('*', { count: 'exact', head: true }).eq('is_unlocked', true);

      document.getElementById('statPending').textContent = pending || 0;
      document.getElementById('statBlocked').textContent = blocked || 0;
      document.getElementById('statUnlocked').textContent = unlocked || 0;

      const { data: rev } = await supabaseClient.rpc('admin_revenue_stats');
      if (rev) {
        document.getElementById('statRevenue').textContent = Number(rev.month).toLocaleString('fr-FR') + ' F';
        document.getElementById('statTotal').textContent = Number(rev.total).toLocaleString('fr-FR') + ' FCFA';
        document.getElementById('statCount').textContent = rev.count;
      }
    }

    async function loadPending() {
      const box = document.getElementById('secPending');
      box.innerHTML = '<p class="text-slate-400 text-center py-6">Chargement…</p>';

      const { data: pays } = await supabaseClient
        .from('payments').select('*').eq('status', 'pending')
        .order('created_at', { ascending: false });

      if (!pays || !pays.length) {
        box.innerHTML = '<p class="text-slate-500 text-center py-10">Aucune demande en attente. ✅</p>';
        return;
      }

      const userIds = [...new Set(pays.map(p => p.user_id))];
      const { data: users } = await supabaseClient.from('profiles').select('id, username').in('id', userIds);

      box.innerHTML = pays.map(p => {
        const u = users?.find(x => x.id === p.user_id);
        return `
          <div class="bg-slate-800 rounded-xl p-4 border border-slate-700">
            <div class="flex justify-between items-start mb-2">
              <div>
                <p class="font-semibold text-emerald-400">${u?.username || 'Utilisateur'}</p>
                <p class="text-xs text-slate-400">${fmtDate(p.created_at)}</p>
                <p class="text-xs text-slate-400">Fournisseur : <b>${p.provider}</b> · Montant : <b>${p.amount} ${p.currency}</b></p>
              </div>
              <span class="text-xs bg-amber-500/20 text-amber-400 px-2 py-1 rounded-full">En attente</span>
            </div>
            <div class="flex gap-2 mt-3">
              <button onclick="approve('${p.id}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-semibold">
                ✅ Approuver
              </button>
              <button onclick="reject('${p.id}')" class="bg-red-600/30 hover:bg-red-600/50 text-red-300 py-2 px-3 rounded-lg text-sm">
                ❌ Refuser
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadUsers() {
      const box = document.getElementById('secUsers');
      box.innerHTML = '<p class="text-slate-400 text-center py-6">Chargement…</p>';

      const { data: users } = await supabaseClient
        .from('profiles').select('*')
        .order('created_at', { ascending: false }).limit(100);

      if (!users || !users.length) {
        box.innerHTML = '<p class="text-slate-500 text-center py-10">Aucun utilisateur.</p>';
        return;
      }

      box.innerHTML = users.map(u => `
        <div class="bg-slate-800 rounded-xl p-3 flex items-center justify-between border ${u.is_blocked ? 'border-red-700/50' : 'border-slate-700'}">
          <div class="flex items-center gap-3 min-w-0">
            ${u.avatar_url
              ? `<img src="${u.avatar_url}" class="w-10 h-10 rounded-full object-cover">`
              : `<div class="w-10 h-10 rounded-full bg-emerald-600/30 flex items-center justify-center font-bold">${(u.username||'?').charAt(0).toUpperCase()}</div>`}
            <div class="min-w-0">
              <p class="font-medium text-sm truncate">${u.username} ${u.is_admin ? '<span class="text-xs text-emerald-400">(admin)</span>' : ''}</p>
              <p class="text-xs text-slate-400">${u.city || ''}${u.city && u.country ? ', ' : ''}${u.country || ''}</p>
              ${u.is_blocked ? `<p class="text-xs text-red-400">🚫 Bloqué : ${u.blocked_reason || ''}</p>` : ''}
            </div>
          </div>
          <div class="flex gap-1 shrink-0">
            ${u.is_admin ? '' : `
              ${u.is_blocked
                ? `<button onclick="unblockUser('${u.id}')" class="text-xs bg-emerald-600 hover:bg-emerald-700 px-2 py-1 rounded">✅ Activer</button>`
                : `<button onclick="blockUser('${u.id}')" class="text-xs bg-amber-600 hover:bg-amber-700 px-2 py-1 rounded">🚫 Bloquer</button>`}
              <button onclick="deleteUser('${u.id}', '${u.username}')" class="text-xs bg-red-600 hover:bg-red-700 px-2 py-1 rounded">🗑️</button>
            `}
          </div>
        </div>
      `).join('');
    }

    async function loadAll() {
      const box = document.getElementById('secAll');
      box.innerHTML = '<p class="text-slate-400 text-center py-6">Chargement…</p>';

      const { data: convs } = await supabaseClient
        .from('conversations').select('*')
        .order('last_message_at', { ascending: false }).limit(50);

      if (!convs || !convs.length) {
        box.innerHTML = '<p class="text-slate-500 text-center py-10">Aucune conversation.</p>';
        return;
      }

      const ids = [...new Set([...convs.map(c=>c.participant_one), ...convs.map(c=>c.participant_two)])];
      const { data: users } = await supabaseClient.from('profiles').select('id, username').in('id', ids);

      box.innerHTML = convs.map(c => {
        const p1 = users?.find(u => u.id === c.participant_one);
        const p2 = users?.find(u => u.id === c.participant_two);
        const locked = !c.is_unlocked && c.message_count >= 10;
        return `
          <div class="bg-slate-800 rounded-xl p-3 flex items-center justify-between">
            <div>
              <p class="font-medium text-sm">${p1?.username || '?'} ↔ ${p2?.username || '?'}</p>
              <p class="text-xs text-slate-400">${c.message_count} messages</p>
            </div>
            <div class="flex items-center gap-2">
              ${c.is_unlocked
                ? '<span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded-full">Illimité</span>'
                : locked
                  ? '<span class="text-xs bg-red-500/20 text-red-400 px-2 py-1 rounded-full">Bloqué</span>'
                  : '<span class="text-xs bg-slate-600/30 text-slate-400 px-2 py-1 rounded-full">En cours</span>'}
              ${locked ? `<button onclick="forceUnlock('${c.id}')" class="text-xs bg-emerald-600 hover:bg-emerald-700 px-2 py-1 rounded">Forcer</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadReports() {
      const box = document.getElementById('secReports');
      box.innerHTML = '<p class="text-slate-400 text-center py-6">Chargement…</p>';

      const { data } = await supabaseClient.from('reports')
        .select('*').order('created_at', { ascending: false }).limit(50);

      if (!data || !data.length) {
        box.innerHTML = '<p class="text-slate-500 text-center py-10">Aucun signalement. ✅</p>';
        return;
      }

      const ids = [...new Set([...data.map(r=>r.reporter_id), ...data.map(r=>r.reported_id)])];
      const { data: users } = await supabaseClient.from('profiles').select('id, username').in('id', ids);

      box.innerHTML = data.map(r => {
        const rep = users?.find(u => u.id === r.reporter_id);
        const ted = users?.find(u => u.id === r.reported_id);
        return `
          <div class="bg-slate-800 rounded-xl p-3 border border-slate-700">
            <p class="text-xs text-slate-400">${fmtDate(r.created_at)}</p>
            <p class="font-medium text-sm"><span class="text-amber-400">${rep?.username || '?'}</span> signale <span class="text-red-400">${ted?.username || '?'}</span></p>
            <p class="text-sm mt-1">📝 ${r.reason}</p>
            ${r.details ? `<p class="text-xs text-slate-400 mt-1">${r.details}</p>` : ''}
          </div>
        `;
      }).join('');
    }

    async function loadSettings() {
      const box = document.getElementById('secSettings');
      const { data: s } = await supabaseClient.from('payment_settings').select('*').eq('id', 1).single();
      const p = s || {};

      box.innerHTML = `
        <div class="space-y-4">

          <!-- SECTION INTERNATIONAL -->
          <div class="bg-slate-800 rounded-xl p-4 space-y-3 border border-blue-700/30">
            <h3 class="text-sm font-bold text-blue-400 flex items-center gap-2">🌍 Paiement International (carte)</h3>
            <p class="text-xs text-slate-400">Ces options apparaissent aux utilisateurs d'Asie, d'Europe, d'Amérique…</p>

            <div>
              <label class="block text-xs text-slate-400 mb-1">💳 Lien PayPal.me</label>
              <input type="text" id="set_paypal_link" value="${p.paypal_link || ''}" placeholder="https://paypal.me/TonPseudo"
                     class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">📧 Email PayPal (backup)</label>
              <input type="text" id="set_paypal_email" value="${p.paypal_email || ''}" placeholder="ton@email.com"
                     class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">🌊 Lien Wise (optionnel)</label>
              <input type="text" id="set_wise_link" value="${p.wise_link || ''}" placeholder="https://wise.com/pay/..."
                     class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">🅿️ Lien Payoneer (optionnel)</label>
              <input type="text" id="set_payoneer_link" value="${p.payoneer_link || ''}" placeholder="https://payoneer.com/..."
                     class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">📝 Instructions internationales</label>
              <textarea id="set_intl_instr" rows="2" placeholder="Ex: Envoyez le paiement puis notez la référence"
                        class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">${p.international_instructions || ''}</textarea>
            </div>
          </div>

          <!-- SECTION ELYONPAY (réservée pour la suite) -->
          <div class="bg-slate-800 rounded-xl p-4 space-y-3 border-2 border-dashed border-violet-700/40">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold text-violet-400 flex items-center gap-2">🎯 ElyonPay — Paiement automatique</h3>
              <span class="text-[10px] bg-violet-500/20 text-violet-300 px-2 py-1 rounded-full">À configurer</span>
            </div>
            <p class="text-xs text-slate-400">
              Cette section est <b>préparée</b> pour quand tu auras tes clés ElyonPay.
              Le paiement par carte s'activera automatiquement dès que tu rempliras les 3 champs.
            </p>

            <div>
              <label class="block text-xs text-slate-400 mb-1">🔑 Clé publique ElyonPay</label>
              <input type="text" id="set_elyon_public" value="${p.elyonpay_public_key || ''}" placeholder="ek_public_xxxxx"
                     class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">🔒 Clé secrète ElyonPay (⚠️ confidentielle)</label>
              <input type="password" id="set_elyon_secret" value="${p.elyonpay_secret_key || ''}" placeholder="ek_secret_xxxxx"
                     class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">🆔 Site ID ElyonPay</label>
              <input type="text" id="set_elyon_site" value="${p.elyonpay_site_id || ''}" placeholder="site_xxxxx"
                     class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">
            </div>

            <div class="flex items-center gap-3 p-3 bg-slate-900/50 rounded-lg">
              <input type="checkbox" id="set_elyon_enabled" ${p.elyonpay_enabled ? 'checked' : ''} class="w-5 h-5">
              <label for="set_elyon_enabled" class="text-sm text-slate-300">Activer ElyonPay sur mon site</label>
            </div>

            <div class="flex items-center gap-3 p-3 bg-slate-900/50 rounded-lg">
              <input type="checkbox" id="set_elyon_test" ${p.elyonpay_test_mode !== false ? 'checked' : ''} class="w-5 h-5">
              <label for="set_elyon_test" class="text-sm text-slate-300">Mode test (décoche quand tu es prêt)</label>
            </div>

            <p class="text-[11px] text-slate-500">💡 Va sur <a href="https://elyonpay.com" target="_blank" class="text-violet-400 underline">elyonpay.com</a> pour créer ton compte marchand et obtenir ces clés.</p>
          </div>

          <!-- SECTION AFRIQUE -->
          <div class="bg-slate-800 rounded-xl p-4 space-y-3 border border-orange-700/30">
            <h3 class="text-sm font-bold text-orange-400 flex items-center gap-2">📱 Mobile Money (Afrique)</h3>

            <div>
              <label class="block text-xs text-slate-400 mb-1">📱 MTN Mobile Money</label>
              <input type="text" id="set_mtn" value="${p.mtn_number || ''}" placeholder="+237 6XX XX XX XX"
                     class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">🟠 Orange Money</label>
              <input type="text" id="set_orange" value="${p.orange_number || ''}" placeholder="+237 6XX XX XX XX"
                     class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">🌊 Wave</label>
              <input type="text" id="set_wave" value="${p.wave_number || ''}" placeholder="+237 6XX XX XX XX"
                     class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">💬 WhatsApp contact</label>
              <input type="text" id="set_whatsapp" value="${p.whatsapp_contact || ''}" placeholder="+237 6XX XX XX XX"
                     class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">📝 Instructions Mobile Money</label>
              <textarea id="set_instr" rows="2" placeholder="Ex: Envoyez la capture du paiement par WhatsApp"
                        class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg outline-none text-white text-sm">${p.instructions || ''}</textarea>
            </div>
          </div>

          <button onclick="saveSettings()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-semibold">
            💾 Enregistrer toutes les coordonnées
          </button>
          <p id="setMsg" class="hidden text-sm text-center"></p>
        </div>
      `;
    }

    async function saveSettings() {
      const data = {
        id: 1,
        // International
        paypal_link: document.getElementById('set_paypal_link').value.trim(),
        paypal_email: document.getElementById('set_paypal_email').value.trim(),
        wise_link: document.getElementById('set_wise_link').value.trim(),
        payoneer_link: document.getElementById('set_payoneer_link').value.trim(),
        international_instructions: document.getElementById('set_intl_instr').value.trim(),
        // ElyonPay
        elyonpay_public_key: document.getElementById('set_elyon_public').value.trim(),
        elyonpay_secret_key: document.getElementById('set_elyon_secret').value.trim(),
        elyonpay_site_id: document.getElementById('set_elyon_site').value.trim(),
        elyonpay_enabled: document.getElementById('set_elyon_enabled').checked,
        elyonpay_test_mode: document.getElementById('set_elyon_test').checked,
        // Afrique
        mtn_number: document.getElementById('set_mtn').value.trim(),
        orange_number: document.getElementById('set_orange').value.trim(),
        wave_number: document.getElementById('set_wave').value.trim(),
        whatsapp_contact: document.getElementById('set_whatsapp').value.trim(),
        instructions: document.getElementById('set_instr').value.trim(),
        updated_at: new Date().toISOString()
      };
      const { error } = await supabaseClient.from('payment_settings').upsert(data);
      const m = document.getElementById('setMsg');
      m.textContent = error ? '❌ ' + error.message : '✅ Enregistré !';
      m.className = 'text-sm text-center mt-2 ' + (error ? 'text-red-400' : 'text-emerald-400');
      m.classList.remove('hidden');
    }

    async function approve(id) {
      if (!confirm('Confirmer le paiement et débloquer la conversation ?')) return;
      const { error } = await supabaseClient.rpc('admin_approve_payment', { p_payment_id: id });
      if (error) { alert('Erreur : ' + error.message); return; }
      alert('✅ Conversation débloquée !');
      refreshAll();
    }

    async function reject(id) {
      const note = prompt('Motif du refus :') || '';
      const { error } = await supabaseClient.rpc('admin_reject_payment', { p_payment_id: id, p_note: note });
      if (error) { alert('Erreur : ' + error.message); return; }
      alert('❌ Refusé.');
      refreshAll();
    }

    async function forceUnlock(convId) {
      if (!confirm('Débloquer SANS paiement ?')) return;
      const { error } = await supabaseClient.from('conversations')
        .update({ is_unlocked: true, unlocked_at: new Date().toISOString() }).eq('id', convId);
      if (error) { alert('Erreur : ' + error.message); return; }
      alert('✅ Débloqué !');
      refreshAll();
    }

    async function blockUser(userId) {
      const reason = prompt('Raison du blocage :') || 'Comportement inapproprié';
      const { error } = await supabaseClient.rpc('admin_block_user', { p_user_id: userId, p_reason: reason });
      if (error) { alert('Erreur : ' + error.message); return; }
      alert('🚫 Utilisateur bloqué.');
      refreshAll();
    }

    async function unblockUser(userId) {
      if (!confirm('Réactiver cet utilisateur ?')) return;
      const { error } = await supabaseClient.rpc('admin_unblock_user', { p_user_id: userId });
      if (error) { alert('Erreur : ' + error.message); return; }
      alert('✅ Utilisateur réactivé.');
      refreshAll();
    }

    async function deleteUser(userId, username) {
      if (!confirm(`⚠️ SUPPRIMER "${username}" ?\n\nIRRÉVERSIBLE.`)) return;
      const confirm2 = prompt(`Tape "SUPPRIMER" pour confirmer :`);
      if (confirm2 !== 'SUPPRIMER') { alert('Annulé.'); return; }
      const { error } = await supabaseClient.from('profiles').delete().eq('id', userId);
      if (error) { alert('Erreur : ' + error.message); return; }
      alert('🗑️ Utilisateur supprimé.');
      refreshAll();
    }

    async function refreshAll() {
      loadStats(); loadPending(); loadUsers(); loadAll(); loadReports(); loadSettings();
    }

    (async () => {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;

      const { data: p } = await supabaseClient.from('profiles')
        .select('is_admin').eq('id', user.id).single();

      if (!p?.is_admin) {
        document.body.innerHTML = `
          <div class="min-h-screen flex items-center justify-center bg-slate-900 p-6">
            <div class="bg-red-500/10 border border-red-500/30 rounded-2xl p-6 text-center max-w-md">
              <p class="text-4xl mb-3">🚫</p>
              <h1 class="text-lg font-bold text-red-400 mb-2">Accès refusé</h1>
              <a href="dashboard.html" class="text-emerald-400 underline text-sm">Retour au site</a>
            </div>
          </div>`;
        return;
      }

      refreshAll();
      setInterval(refreshAll, 30000);
    })();
  </script>
</body>
</html>
