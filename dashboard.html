<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon profil — InshaAllah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-emerald-50 min-h-screen">
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2 font-bold text-emerald-700">
        <span class="text-xl">🌙</span><span>InshaAllah</span>
      </div>
      <nav class="flex items-center gap-3">
        <a href="search.html" class="text-2xl" title="Rechercher">🔍</a>
        <a href="chat.html" class="relative text-2xl" title="Messages">
          🔔
          <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full min-w-[18px] h-[18px] flex items-center justify-center font-bold px-1">0</span>
        </a>
        <a href="admin.html" id="adminBtn" class="hidden text-2xl" title="Admin">⚙️</a>
        <button onclick="logout()" class="text-red-600 text-sm font-medium">Déco</button>
      </nav>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4">
    <h1 class="text-xl font-bold text-slate-800 mb-1">Salam aleykoum 👋</h1>
    <p class="text-sm text-slate-500 mb-6" id="welcome">Chargement…</p>

    <div class="bg-white rounded-2xl shadow p-5 mb-4">
      <h2 class="font-bold text-lg mb-4">Ma photo de profil</h2>
      <div class="flex items-center gap-4">
        <div id="avatarPreview" class="w-24 h-24 rounded-full bg-emerald-100 flex items-center justify-center overflow-hidden shrink-0">
          <span class="text-3xl text-emerald-700 font-bold">?</span>
        </div>
        <div class="flex-1">
          <input type="file" id="avatarInput" accept="image/*" class="hidden">
          <button type="button" onclick="document.getElementById('avatarInput').click()"
                  class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-sm">
            📸 Choisir une photo
          </button>
          <p class="text-xs text-slate-500 mt-2 text-center">JPG ou PNG · 2 Mo max</p>
        </div>
      </div>
      <div id="avatarMessage" class="hidden mt-3 p-2 rounded-lg text-xs text-center"></div>
    </div>

    <form id="profileForm" class="bg-white rounded-2xl shadow p-5 space-y-4">
      <h2 class="font-bold text-lg">Mon profil</h2>
      <div>
        <label class="block text-sm font-medium mb-1">Pseudo</label>
        <input type="text" id="username" required class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Date de naissance</label>
        <input type="date" id="birth_date" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">Pays</label>
          <input type="text" id="country" placeholder="Cameroun" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Ville</label>
          <input type="text" id="city" placeholder="Douala" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Niveau de pratique</label>
        <select id="religiosity_level" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none bg-white">
          <option value="">— Choisir —</option>
          <option value="modere">Modéré</option>
          <option value="pratiquant">Pratiquant</option>
          <option value="tres_pratiquant">Très pratiquant</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Situation maritale</label>
        <select id="marital_status" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none bg-white">
          <option value="">— Choisir —</option>
          <option value="celibataire">Célibataire</option>
          <option value="divorce">Divorcé(e)</option>
          <option value="veuf">Veuf(ve)</option>
          <option value="marie">Marié(e) — ouvert(e) à la polygamie</option>
        </select>
      </div>
      <div class="border-t pt-3">
        <label class="block text-sm font-medium mb-1">Enfants</label>
        <select id="has_children" onchange="toggleChildren()" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none bg-white">
          <option value="false">N'a pas d'enfants</option>
          <option value="true">A des enfants</option>
        </select>
        <div id="childrenCountDiv" class="hidden mt-2">
          <label class="block text-sm font-medium mb-1">Nombre d'enfants</label>
          <input type="number" id="children_count" min="1" max="15" value="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Cadre de vie</label>
        <select id="living_situation" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none bg-white">
          <option value="">— Choisir —</option>
          <option value="seul">Vit seul(e)</option>
          <option value="famille">Vit en famille / chez les parents</option>
        </select>
      </div>
      <div class="border-t pt-3 space-y-3">
        <h3 class="font-semibold text-slate-700 text-sm">Situation socio-économique</h3>
        <div>
          <label class="block text-sm font-medium mb-1">Profession</label>
          <input type="text" id="profession" placeholder="Ex: Ingénieur…" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Tranche de revenus (optionnel)</label>
          <select id="income_range" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none bg-white">
            <option value="">— Préfère ne pas dire —</option>
            <option value="< 500 000 FCFA">Moins de 500 000 FCFA</option>
            <option value="500 000 - 1 500 000 FCFA">500 000 – 1 500 000 FCFA</option>
            <option value="1 500 000 - 3 000 000 FCFA">1 500 000 – 3 000 000 FCFA</option>
            <option value="> 3 000 000 FCFA">Plus de 3 000 000 FCFA</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Niveau d'études</label>
          <select id="education_level" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none bg-white">
            <option value="">— Choisir —</option>
            <option value="Baccalauréat">Baccalauréat</option>
            <option value="Licence">Licence</option>
            <option value="Master">Master</option>
            <option value="Doctorat">Doctorat</option>
            <option value="Formation professionnelle">Formation professionnelle</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Bio</label>
        <textarea id="bio" rows="3" placeholder="Parlez de vous…" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none"></textarea>
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl">
        Enregistrer mon profil
      </button>
    </form>

    <div id="message" class="hidden mt-4 p-3 rounded-lg text-sm"></div>
  </main>

  <script>
    const msg = document.getElementById('message');
    const avatarMsg = document.getElementById('avatarMessage');
    let currentUser = null;
    let currentGender = 'male';
    let currentAvatarUrl = null;

    function show(t, c) {
      msg.textContent = t;
      msg.className = 'mt-4 p-3 rounded-lg text-sm ' + (c === 'ok'
        ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
        : 'bg-red-50 text-red-700 border border-red-200');
      msg.classList.remove('hidden');
    }
    function showAvatar(t, c) {
      avatarMsg.textContent = t;
      avatarMsg.className = 'mt-3 p-2 rounded-lg text-xs text-center ' + (c === 'ok'
        ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700');
      avatarMsg.classList.remove('hidden');
    }
    function toggleChildren() {
      const v = document.getElementById('has_children').value === 'true';
      document.getElementById('childrenCountDiv').classList.toggle('hidden', !v);
    }
    function setAvatarPreview(url, username) {
      const box = document.getElementById('avatarPreview');
      if (url) box.innerHTML = '<img src="' + url + '" class="w-full h-full object-cover">';
      else box.innerHTML = '<span class="text-3xl text-emerald-700 font-bold">' + (username ? username.charAt(0).toUpperCase() : '?') + '</span>';
    }
    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }
    async function loadNotifBadge() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return;
      const { data: convs } = await supabaseClient.from('conversations').select('id')
        .or('participant_one.eq.' + user.id + ',participant_two.eq.' + user.id);
      if (!convs || !convs.length) return;
      const convIds = convs.map(c => c.id);
      const { count } = await supabaseClient.from('messages')
        .select('*', { count: 'exact', head: true })
        .in('conversation_id', convIds).eq('is_read', false).neq('sender_id', user.id);
      const badge = document.getElementById('notifBadge');
      if (count && count > 0) { badge.textContent = count > 99 ? '99+' : count; badge.classList.remove('hidden'); }
      else badge.classList.add('hidden');
    }

    document.getElementById('avatarInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { showAvatar('❌ Fichier trop lourd (max 2 Mo)', 'err'); return; }
      if (!file.type.startsWith('image/')) { showAvatar('❌ Format invalide', 'err'); return; }
      showAvatar('⏳ Upload en cours…', 'ok');
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = currentUser.id + '/avatar.' + ext;
      const { error: upErr } = await supabaseClient.storage.from('avatars').upload(path, file, { upsert: true, contentType: file.type });
      if (upErr) { showAvatar('❌ ' + upErr.message, 'err'); return; }
      const { data: pub } = supabaseClient.storage.from('avatars').getPublicUrl(path);
      const url = pub.publicUrl + '?v=' + Date.now();
      const { error: dbErr } = await supabaseClient.from('profiles').update({ avatar_url: url }).eq('id', currentUser.id);
      if (dbErr) { showAvatar('❌ ' + dbErr.message, 'err'); return; }
      currentAvatarUrl = url;
      setAvatarPreview(url, null);
      showAvatar('✅ Photo mise à jour !', 'ok');
    });

    (async () => {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      loadNotifBadge();
      setInterval(loadNotifBadge, 15000);

      const { data: p } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
      if (p) {
        // Afficher le bouton admin si admin
        if (p.is_admin) document.getElementById('adminBtn').classList.remove('hidden');
        currentGender = p.gender || 'male';
        currentAvatarUrl = p.avatar_url;
        document.getElementById('username').value = p.username || '';
        document.getElementById('birth_date').value = p.birth_date || '';
        document.getElementById('country').value = p.country || '';
        document.getElementById('city').value = p.city || '';
        document.getElementById('religiosity_level').value = p.religiosity_level || '';
        document.getElementById('marital_status').value = p.marital_status || '';
        document.getElementById('living_situation').value = p.living_situation || '';
        document.getElementById('profession').value = p.profession || '';
        document.getElementById('income_range').value = p.income_range || '';
        document.getElementById('education_level').value = p.education_level || '';
        document.getElementById('bio').value = p.bio || '';
        document.getElementById('has_children').value = p.has_children ? 'true' : 'false';
        if (p.has_children) document.getElementById('children_count').value = p.children_count || 1;
        toggleChildren();
        setAvatarPreview(p.avatar_url, p.username);
        document.getElementById('welcome').textContent = 'Bienvenue ' + (p.username || user.email);
      } else {
        document.getElementById('welcome').textContent = 'Complète ton profil ci-dessous.';
        setAvatarPreview(null, null);
      }
    })();

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;
      const hasChildren = document.getElementById('has_children').value === 'true';
      const data = {
        id: currentUser.id,
        username: document.getElementById('username').value.trim(),
        gender: currentGender,
        avatar_url: currentAvatarUrl,
        birth_date: document.getElementById('birth_date').value || null,
        country: document.getElementById('country').value.trim() || null,
        city: document.getElementById('city').value.trim() || null,
        religiosity_level: document.getElementById('religiosity_level').value || null,
        marital_status: document.getElementById('marital_status').value || null,
        living_situation: document.getElementById('living_situation').value || null,
        profession: document.getElementById('profession').value.trim() || null,
        income_range: document.getElementById('income_range').value || null,
        education_level: document.getElementById('education_level').value || null,
        has_children: hasChildren,
        children_count: hasChildren ? parseInt(document.getElementById('children_count').value) || 0 : 0,
        bio: document.getElementById('bio').value.trim() || null
      };
      const { error } = await supabaseClient.from('profiles').upsert(data, { onConflict: 'id' });
      if (error) show('❌ ' + error.message, 'err');
      else { show('✅ Profil enregistré !', 'ok'); setTimeout(() => window.location.href = 'search.html', 1200); }
    });
  </script>
</body>
</html>
