<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — InshaAllah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <div class="text-4xl mb-2">🌙</div>
      <h1 class="text-2xl font-bold text-emerald-700">Se connecter</h1>
      <p class="text-sm text-slate-500 mt-1">Content de vous revoir</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" id="email" required
               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
               placeholder="vous@exemple.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
        <input type="password" id="password" required
               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
               placeholder="Votre mot de passe">
      </div>

      <button type="submit" id="btnSubmit"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition disabled:opacity-50">
        Se connecter
      </button>
    </form>

    <div id="message" class="hidden mt-4 p-3 rounded-lg text-sm"></div>

    <p class="text-center text-sm text-slate-500 mt-6">
      Pas encore de compte ?
      <a href="signup.html" class="text-emerald-600 font-medium hover:underline">S'inscrire</a>
    </p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('btnSubmit');
    const msg = document.getElementById('message');

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = 'mt-4 p-3 rounded-lg text-sm ' + (
        type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                            : 'bg-red-50 text-red-700 border border-red-200'
      );
      msg.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Connexion…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        showMessage('✅ Connexion réussie ! Redirection…', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);
      } catch (err) {
        console.error(err);
        showMessage('❌ ' + (err.message || 'Email ou mot de passe incorrect'), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
