<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — InshaAllah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <div class="text-center mb-8">
        <div class="text-4xl mb-2">🌙</div>
        <h1 class="text-2xl font-bold text-emerald-700">Se connecter</h1>
        <p class="text-sm text-slate-500 mt-1">Content de vous revoir</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="email" required
                 class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none"
                 placeholder="vous@exemple.com">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
          <div class="relative">
            <input type="password" id="password" required
                   class="w-full px-4 py-3 pr-12 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none"
                   placeholder="Votre mot de passe">
            <button type="button" onclick="togglePassword('password', this)"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-600 text-xl">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" id="btnSubmit"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl disabled:opacity-50">
          Se connecter
        </button>
      </form>

      <div id="message" class="hidden mt-4 p-3 rounded-lg text-sm"></div>

      <p class="text-center text-sm text-slate-500 mt-6">
        Pas encore de compte ?
        <a href="signup.html" class="text-emerald-600 font-medium hover:underline">S'inscrire</a>
      </p>
    </div>

    <div class="mt-4 text-center text-xs text-slate-500 space-x-3">
      <a href="terms.html" class="hover:text-emerald-700">Conditions d'utilisation</a>
      <span>·</span>
      <a href="privacy.html" class="hover:text-emerald-700">Confidentialité</a>
    </div>
  </div>

  <script>
    const msg = document.getElementById('message');
    function showMessage(t, c) {
      msg.textContent = t;
      msg.className = 'mt-4 p-3 rounded-lg text-sm whitespace-pre-line ' + (c === 'ok'
        ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
        : 'bg-red-50 text-red-700 border border-red-200');
      msg.classList.remove('hidden');
    }

    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
      else { input.type = 'password'; btn.textContent = '👁️'; }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true; btn.textContent = 'Connexion…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        showMessage('❌ ' + error.message, 'err');
        btn.disabled = false; btn.textContent = 'Se connecter';
        return;
      }

      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('is_blocked, blocked_reason, country, birth_date, gender')
        .eq('id', data.user.id)
        .single();

      if (profile?.is_blocked) {
        await supabaseClient.auth.signOut();
        showMessage(
          '🚫 Votre compte a été suspendu.\n\n' +
          'Raison : ' + (profile.blocked_reason || 'Non précisée') + '\n\n' +
          'Contactez l\'administrateur pour plus d\'informations.',
          'err'
        );
        btn.disabled = false; btn.textContent = 'Se connecter';
        return;
      }

      const isComplete = profile && profile.country && profile.birth_date && profile.gender;

      if (isComplete) {
        showMessage('✅ Redirection vers tes messages…', 'ok');
        setTimeout(() => window.location.href = 'chat.html', 600);
      } else {
        showMessage('✅ Complète ton profil…', 'ok');
        setTimeout(() => window.location.href = 'dashboard.html', 600);
      }
    });
  </script>
</body>
</html>
